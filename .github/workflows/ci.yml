name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0" # Weekly tests with prerelease dependencies.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheels:
    uses: ./.github/workflows/wheels.yml

  check-manifest:
    name: Check Manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
      - run: uvx check-manifest

  test:
    name: Test (${{ matrix.platform.name }} py${{ matrix.python-version }})
    needs: wheels
    runs-on: ${{ matrix.platform.os }}
    defaults:
      run:
        shell: bash
    env:
      UV_MANAGED_PYTHON: "1"
      UV_PRERELEASE: ${{ github.event_name == 'schedule' && 'allow' || 'if-necessary-or-explicit' }}
      COVERAGE_FILE: ${{ github.workspace }}/.coverage
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {os: ubuntu-latest, name: linux-x86_64}
          - {os: windows-latest, name: windows-x86_64}
          - {os: macos-15-intel, name: macos-x86_64}
          - {os: macos-15, name: macos-arm64}
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - uses: actions/download-artifact@v8
        with:
          name: dist-source
          path: wheelhouse

      - name: Install Python wheel
        run: |
          uv venv "$RUNNER_TEMP/.venv"
          wheels=(wheelhouse/*.whl)
          uv pip install --python "$RUNNER_TEMP/.venv" "${wheels[0]}[test]"

      - name: Test installed wheel
        run: |
          cp -R tests "$RUNNER_TEMP/tests"
          cd "$RUNNER_TEMP"
          uv run --python .venv coverage run --rcfile="$GITHUB_WORKSPACE/pyproject.toml" -p -m pytest tests -v --color=yes

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: covreport-${{ matrix.platform.name }}-py${{ matrix.python-version }}
          path: ./.coverage*
          include-hidden-files: true

  coverage:
    name: Combine and Upload Coverage
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - run: uv sync --extra test

      - name: Download coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: covreport-*
          path: coverage-artifacts
          merge-multiple: false

      - name: Combine coverage data
        run: |
          find coverage-artifacts -name '.coverage*' -type f -exec cp {} . \;
          uv run coverage combine
          uv run coverage xml -o coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  deploy_testpypi:
    name: Deploy to TestPyPI
    needs: [check-manifest, test]
    if: success() && startsWith(github.ref, 'refs/tags/') && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Download tested distributions
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_TOKEN }}

  deploy_pypi:
    name: Deploy to PyPI
    needs: [check-manifest, test, deploy_testpypi]
    if: success() && startsWith(github.ref, 'refs/tags/') && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Download tested distributions
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}

  publish:
    name: Publish to GitHub Releases
    needs: [test, check-manifest, deploy_pypi]
    if: success() && startsWith(github.ref, 'refs/tags/') && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Download tested distributions
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*
