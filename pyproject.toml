[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pytsf"
version = "1.0.0"
description = "Pure-Python reader for Bruker timsTOF TSF (.d) spectrum data — works on macOS, where Bruker ships no library"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.20",
    "zstandard>=0.21",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["pytsf*"]
